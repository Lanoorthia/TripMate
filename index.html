<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TripMate — Prototype3 </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar{display:none}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    .line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    
    .masonry{ column-count: 1; column-gap: 1rem; }
    @media (min-width: 768px){ .masonry{ column-count: 2; } }
    @media (min-width: 1024px){ .masonry{ column-count: 3; } }
    .masonry-item{ break-inside: avoid; }

    .chip{ display:inline-flex; align-items:center; gap:.35rem; font-size:.875rem; padding:.25rem .6rem;
           border-radius:999px; border:1px solid rgba(148,163,184,.35); background:rgba(148,163,184,.12); }
    .chip:hover{ filter:brightness(1.05); }
    .ratio-4-5{ position:relative; padding-bottom:125%; }
    .ratio-4-5 > *{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:.75rem; }
    .btn{ border:1px solid #2563eb; color:#2563eb; padding:.5rem .9rem; border-radius:999px; }
    .btn:hover{ background:#2563eb; color:#fff; }
    .btn-solid{ background:#2563eb; color:#fff; border:0; }
    .btn-solid:hover{ filter:brightness(1.05); }
    .focus-ring:focus-visible{ outline:2px solid #2563eb; outline-offset:2px; }

    .no-scrollbar{ scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar{ display:none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="inline-flex w-5 h-5 items-center justify-center text-blue-600">📍</span>
        <div class="font-bold text-lg">TripMate</div>
      </div>
      <div class="flex items-center gap-2">
        <a href="https://forms.gle/JuJ2WWLeiRyTQSNU6" target="_blank" rel="noopener"
           class="border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white transition rounded-2xl px-4 py-1.5 text-sm">
           ส่งฟีดแบ็ก
        </a>
      </div>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-4 pb-24">
    <section id="page-discover" class="space-y-4">
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <input id="discoverSearchInput" class="w-full border rounded-xl pl-9 pr-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" placeholder="ค้นหา...">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">🔎</span>
        </div>
        <button id="openCreatePost" class="bg-blue-600 hover:bg-blue-700 text-white rounded-2xl px-4 py-2">เพิ่มโพสต์</button>
      </div>
      <div class="flex gap-3 overflow-x-auto no-scrollbar" id="promoBanners"></div>
      <div class="flex items-center gap-2 text-sm text-gray-700">🔥 แฮชแท็กยอดนิยม</div>
      <div class="flex gap-2 overflow-x-auto no-scrollbar" id="topTags"></div>
      <div class="flex items-center gap-2 mt-2">
        <button id="modePostsBtn" class="bg-blue-600 text-white rounded-2xl px-3 py-1.5 text-sm">โพสต์ล่าสุด</button>
        <button id="modeTilesBtn" class="border border-gray-300 rounded-2xl px-3 py-1.5 text-sm">สรุปสถานที่</button>
      </div>
      <div id="discoverContent" class="grid grid-cols-1 gap-3"></div>
    </section>
    <section id="page-search" class="hidden space-y-3">
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <input id="searchInput" class="w-full border rounded-xl pl-9 pr-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" placeholder="ค้นหาที่เที่ยว คาเฟ่ ร้านอาหาร...">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">🔎</span>
        </div>
        <button id="applySearchBtn" class="border border-gray-300 rounded-2xl px-3 py-2">ค้นหา</button>
      </div>
      <div id="categoryChips" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
      <div id="provinceChips" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
      <div class="flex items-center gap-3 text-sm text-gray-600"><span>ระยะทางสูงสุด:</span> <span id="distVal">80</span> กม.</div>
      <input id="distSlider" type="range" min="5" max="200" step="5" value="80" class="w-full accent-blue-600" />
      <div id="locInfo" class="text-xs text-gray-500"></div>
      <div id="searchResults" class="grid grid-cols-1 gap-3"></div>
    </section>
    <section id="page-groups" class="hidden space-y-4"><div id="groupContainer"></div></section>
    <section id="page-rewards" class="hidden space-y-4">
      <div class="bg-white border rounded-2xl p-4 flex items-center justify-between">
        <div><div class="text-lg font-semibold">แต้มสะสมของคุณ</div><div id="pointsEl" class="text-2xl font-bold text-blue-600">0 pts</div><div id="badgesEl" class="mt-1 text-sm text-gray-500">สถานะ: -</div></div>
        <div class="text-4xl">🏅</div>
      </div>
      <div id="rewardsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>
    <section id="page-profile" class="hidden space-y-4">
      <div class="bg-white border rounded-2xl p-4 flex items-center justify-between">
        <div><div class="text-xl font-semibold"><span id="userNameEl">ผู้ใช้</span> <span id="userHandleEl" class="text-sm text-gray-500">@handle</span></div>
          <div id="userMetaEl" class="text-sm text-gray-500">ระดับ: - · แต้ม: - · สถานะ: -</div></div>
        <div class="text-4xl">👤</div>
      </div>
      <div><div class="font-semibold mb-2">รีวิวของฉัน</div><div id="myReviews" class="space-y-2"></div></div>
    </section>
  </main>
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t z-40">
    <div class="max-w-3xl mx-auto grid grid-cols-5 text-sm">
      <button data-tab="discover" class="py-3 flex flex-col items-center text-blue-600">🏠<span class="text-xs">ค้นพบ</span></button>
      <button data-tab="search" class="py-3 flex flex-col items-center text-gray-600">🔎<span class="text-xs">ค้นหา</span></button>
      <button data-tab="groups" class="py-3 flex flex-col items-center text-gray-600">👥<span class="text-xs">กลุ่ม</span></button>
      <button data-tab="rewards" class="py-3 flex flex-col items-center text-gray-600">⭐<span class="text-xs">รางวัล</span></button>
      <button data-tab="profile" class="py-3 flex flex-col items-center text-gray-600">👤<span class="text-xs">โปรไฟล์</span></button>
    </div>
  </nav>
  <div id="detailModal" class="hidden fixed inset-0 bg-black/50 z-50 p-4"><div class="bg-white w-full max-w-2xl mx-auto mt-[10vh] rounded-2xl p-4">
    <div class="flex items-center justify-between mb-2"><div class="text-lg font-semibold">ข้อมูลเดียวจบ</div><button id="closeDetail" class="px-3 py-1.5 rounded-xl hover:bg-gray-100">✕</button></div>
    <div id="detailContent" class="space-y-4"></div></div></div>
  <div id="createModal" class="hidden fixed inset-0 bg-black/50 z-50 p-4"><div class="bg-white w-full max-w-lg mx-auto mt-[10vh] rounded-2xl p-4">
    <div class="flex items-center justify-between mb-2"><div class="text-lg font-semibold">โพสต์รีวิว</div><button id="closeCreate" class="px-3 py-1.5 rounded-xl hover:bg-gray-100">✕</button></div>
    <div class="space-y-3">
      <div><label class="text-sm">สถานที่</label><select id="createPlace" class="w-full border rounded-md p-2 mt-1"></select></div>
      <div><label class="text-sm">ให้คะแนน: <span id="createRateLabel">5</span> ดาว</label><input id="createRate" type="range" min="1" max="5" step="1" value="5" class="w-full accent-blue-600" /></div>
      <div><label class="text-sm">รีวิว</label><textarea id="createText" rows="4" class="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" placeholder="เล่าประสบการณ์สั้น ๆ ของคุณ"></textarea></div>
      <div id="verifyHint" class="text-sm text-gray-500">* เปิดตำแหน่งใกล้สถานที่เพื่อรับสถานะ Verified</div>
      <div class="flex items-center justify-end gap-2"><button id="cancelCreate" class="border border-gray-300 rounded-2xl px-4 py-2">ยกเลิก</button><button id="submitCreate" class="bg-blue-600 hover:bg-blue-700 text-white rounded-2xl px-4 py-2">โพสต์</button></div>
    </div></div></div>
  <script>
  
  const POSTS = [
      {
        id: "p1",
        user: "Pim",
        avatar: "https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?q=80&w=256&auto=format&fit=crop",
        text: "วันสบายๆ ที่ #ปทุมธานี แวะ #ตลาดวัดศาลเจ้า อิ่มมาก 🥰 #local_food #photo_spot",
        media: { type:"image", src:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop" },
        ratio: "4/5", likes: 12
      },
      {
        id: "p2",
        user: "Non",
        avatar: "https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?q=80&w=256&auto=format&fit=crop",
        text: "เล่นสุดมันที่ #dreamworld #theme_park #family",
        media: { type:"video", src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" },
        ratio: "4/5", likes: 7
      }
    ];

    /* ===== Places (เลือก/เพิ่มสถานที่) ===== */
    const PLACES = [
      { id:"pl_dreamworld", name:"ดรีมเวิลด์", province:"ปทุมธานี", category:"สวนสนุก", openingHours:"10:00–17:00",
        tags:["ครอบครัว","theme_park","เล่นเครื่องเล่น"], photo:"https://images.unsplash.com/photo-1506806732259-39c2d0268443?q=80&w=1200&auto=format&fit=crop" },
      { id:"pl_talad_wat_sanjao", name:"ตลาดวัดศาลเจ้า", province:"ปทุมธานี", category:"ตลาด/ของกิน", openingHours:"10:00–19:00",
        tags:["local_food","street_food","ถ่ายรูป"], photo:"https://images.unsplash.com/photo-1498654896293-37aacf113fd9?q=80&w=1200&auto=format&fit=crop" },
      { id:"pl_river_spot", name:"ริมน้ำเจ้าพระยา (รังสิต-ปทุม)", province:"ปทุมธานี", category:"ธรรมชาติ/วิว", openingHours:"06:00–19:00",
        tags:["วิวสวย","เดินเล่น","photo_spot"], photo:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop" }
    ];

    const currentUser = { id:"u_me", name:"แทมมี่", handle:"@tammy", level:"Explorer", points:520, badges:["Verified Explorer"] };
    const places = [
      { id:"p_khaotao", name:"อ่างเก็บน้ำเขาเต่า", province:"ประจวบคีรีขันธ์", category:"ธรรมชาติ", lat:12.5032, lng:99.9886, openingHours:"06:00–18:30", tags:["วิวสวย","ถ่ายรูป","พระอาทิตย์ตก"], rating:4.8, crowd:"ปานกลาง", photos:["https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop"] },
      { id:"p_somewhere_cnx", name:"Somewhere Cafe", province:"เชียงใหม่", category:"คาเฟ่", lat:18.7953, lng:98.9525, openingHours:"09:00–18:00", tags:["คาเฟ่วิวดี","กาแฟหอม","ภูเขา"], rating:4.5, crowd:"น้อย", photos:["https://images.unsplash.com/photo-1498654896293-37aacf113fd9?q=80&w=1200&auto=format&fit=crop"] },
      { id:"p_monjam", name:"ม่อนแจ่ม", province:"เชียงใหม่", category:"ธรรมชาติ", lat:18.9370, lng:98.8590, openingHours:"05:30–19:00", tags:["ภูเขา","อากาศเย็น","วิวพาโนรามา"], rating:4.7, crowd:"มาก", photos:["https://images.unsplash.com/photo-1528821154947-1aa3d1b749b3?q=80&w=1200&auto=format&fit=crop"] },
      { id:"p_doisuthep", name:"ดอยสุเทพ", province:"เชียงใหม่", category:"แลนด์มาร์ก", lat:18.8047, lng:98.9215, openingHours:"06:00–20:00", tags:["วัด","จุดชมวิว"], rating:4.6, crowd:"มาก", photos:["https://images.unsplash.com/photo-1548013146-72479768bada?q=80&w=1200&auto=format&fit=crop"] },
      { id:"p_bangsaen", name:"หาดบางแสน", province:"ชลบุรี", category:"ธรรมชาติ", lat:13.2756, lng:100.9255, openingHours:"24 ชั่วโมง", tags:["ทะเล","ครอบครัว","ของกินเยอะ"], rating:4.1, crowd:"มาก", photos:["https://images.unsplash.com/photo-1500375592092-40eb2168fd21?q=80&w=1200&auto=format&fit=crop"] },
    ];
    let reviews = [
      { id:"r1", placeId:"p_khaotao", user:"นนท์", userLevel:"Traveler", rating:5, text:"วิวเย็นสบาย ถ่ายรูปพระอาทิตย์ตกสวย แนะนำให้มาเร็ว มีที่จอดริมทาง", verifiedVisit:true, date:"2025-10-01", likes:22 },
      { id:"r2", placeId:"p_somewhere_cnx", user:"แทมมี่", userLevel:"Explorer", rating:4, text:"กาแฟดี กลิ่นหอม บรรยากาศเขียวมาก เหมาะทำงานช่วงบ่าย", verifiedVisit:false, date:"2025-09-20", likes:18 },
      { id:"r3", placeId:"p_monjam", user:"พีท", userLevel:"Local Expert", rating:5, text:"ลมเย็น วิวสวย แต่คนเยอะ ควรไปเช้า วันธรรมดา", verifiedVisit:true, date:"2025-09-12", likes:34 },
      { id:"r4", placeId:"p_bangsaen", user:"ชิว", userLevel:"Traveler", rating:4, text:"ของกินเยอะ สนุกกับเพื่อน แต่แน่นวันหยุด", verifiedVisit:false, date:"2025-08-30", likes:10 },
    ];
    const rewardsCatalog = [
      { id:"rw1", name:"ส่วนลด Grab 50 บาท", cost:300, desc:"ใช้ได้ทุกจังหวัด" },
      { id:"rw2", name:"คูปองเครื่องดื่มฟรี (Cafe Partner)", cost:500, desc:"ร้านที่ร่วมรายการ" },
      { id:"rw3", name:"กระเป๋าผ้า TripMate", cost:800, desc:"จัดส่งฟรี" },
    ];
    let TAB="discover", MODE="posts", QUERY="", CAT="ทั้งหมด", PROV="ทั้งหมด", MAX_KM=80;
    let user = JSON.parse(JSON.stringify(currentUser));
    let userLoc = null;
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    const setHidden = (el,hidden)=> el.classList.toggle("hidden", hidden);
    const kmDist=(a,b,c,d)=>{const R=6371,toRad=x=>x*Math.PI/180;const dLat=toRad(c-a),dLon=toRad(d-b);const A=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A))};
    const fmtKm=km=>km<1?(km*1000).toFixed(0)+" ม.":km.toFixed(1)+" กม.";
    const clip=(s,n)=>s.length>n?s.slice(0,n)+"…":s;
    const latestByPlace=()=>{const sorted=[...reviews].sort((a,b)=>a.date<b.date?1:-1);const m={};for(const r of sorted) if(!m[r.placeId]) m[r.placeId]=r;return m;}
    function filteredPlaces(){
      let arr=places.filter(p=>{const q=QUERY.trim().toLowerCase();const mq=!q||p.name.toLowerCase().includes(q)||p.tags.join(" ").toLowerCase().includes(q);const mc=CAT==="ทั้งหมด"||p.category===CAT;const mp=PROV==="ทั้งหมด"||p.province===PROV;return mq&&mc&&mp;});
      if(userLoc){arr=arr.map(p=>({p,d:kmDist(userLoc.lat,userLoc.lng,p.lat,p.lng)})).filter(({d})=>d<=MAX_KM).sort((a,b)=>a.d-b.d).map(({p})=>p);}else{arr=arr.sort((a,b)=>b.rating-a.rating);}
      return arr;
    }
    function openDetail(place){ renderDetail(place); setHidden($("#detailModal"), false); }
    function closeDetail(){ setHidden($("#detailModal"), true); }
    function openCreate(){ populateCreatePlaces(); updateVerifyHint(); setHidden($("#createModal"), false); }
    function closeCreate(){ setHidden($("#createModal"), true); }
    function renderNav(){ $$(".grid [data-tab]").forEach(btn=>{btn.classList.toggle("text-blue-600",btn.dataset.tab===TAB);btn.classList.toggle("text-gray-600",btn.dataset.tab!==TAB)}); setHidden($("#page-discover"),TAB!=="discover"); setHidden($("#page-search"),TAB!=="search"); setHidden($("#page-groups"),TAB!=="groups"); setHidden($("#page-rewards"),TAB!=="rewards"); setHidden($("#page-profile"),TAB!=="profile"); }
    function renderBanners(){ const banners=[{id:"bn1",title:"โปรพิเศษคาเฟ่ภาคเหนือ",subtitle:"ลด 10% ร้านพาร์ทเนอร์",tag:"#CafeWeek",color:"bg-blue-50",emoji:"☕"},{id:"bn2",title:"ที่เที่ยวธรรมชาติยอดนิยม",subtitle:"พิกัดถ่ายรูปสวย",tag:"#NatureNow",color:"bg-green-50",emoji:"🌿"},{id:"bn3",title:"#เมืองรองกำลังมา",subtitle:"รวมจุดเช็คอินใหม่",tag:"#HiddenGems",color:"bg-amber-50",emoji:"📍"}]; $("#promoBanners").innerHTML=banners.map(b=>`<div class="min-w-[260px] ${b.color} border rounded-2xl p-4"><div class="flex items-start justify-between"><div><div class="text-sm text-gray-600">📣 แนะนำ</div><div class="font-semibold leading-tight">${b.title}</div><div class="text-xs text-gray-500">${b.subtitle}</div></div><div class="text-xl">${b.emoji}</div></div><div class="mt-2"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs border">${b.tag}</span></div></div>`).join(""); }
    function renderTopTags(){ const tags=["#คาเฟ่วิวดี","#ธรรมชาติ","#ครอบครัว","#ถ่ายรูป","#เมืองรอง","#ทะเล","#ภูเขา","#workshop","#แฟน"]; $("#topTags").innerHTML=tags.map(t=>`<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs border whitespace-nowrap">${t}</span>`).join(""); }
    function renderDiscover(){
      const container=$("#discoverContent");
      if(MODE==="posts"){
        const posts=[...reviews].map(r=>({...r,place:places.find(p=>p.id===r.placeId)})).sort((a,b)=>a.date<b.date?1:-1);
        container.innerHTML=posts.map(post=>`<div class="bg-white border rounded-2xl p-4"><div class="flex items-start gap-3"><img src="${post.place.photos[0]}" class="w-28 h-28 object-cover rounded-lg flex-shrink-0"/><div class="flex-1 min-w-0"><div class="flex items-center justify-between"><div class="font-semibold truncate">${post.place.name}</div><div class="text-amber-600 text-sm">⭐ ${post.rating}</div></div><div class="text-xs text-gray-500 truncate">${post.place.province} · ${post.place.category}</div><p class="text-sm mt-2 line-clamp-3">${clip(post.text,160)}</p><div class="mt-2 flex items-center gap-2"><span class="text-xs text-gray-500">— ${post.user} · ${post.userLevel||""}</span>${post.verifiedVisit?`<span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] bg-gray-100">✔︎ Verified Visitor</span>`:""}</div><div class="mt-3 flex items-center justify-between"><div class="flex items-center gap-2 text-xs text-gray-500"><span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] border">#${post.place.tags[0]}</span><span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] border">#${post.place.tags[1]||"เที่ยว"}</span></div><div class="flex items-center gap-2"><button class="border rounded-2xl px-3 py-1.5 text-sm" data-act="detail" data-id="${post.place.id}">ดูรายละเอียด</button><button class="rounded-2xl px-3 py-1.5 text-sm bg-blue-600 text-white" data-act="share" data-text="รีวิว: ${post.place.name} โดย ${post.user}">แชร์</button></div></div></div></div></div>`).join("");
      } else {
        const map=latestByPlace(); const arr=filteredPlaces();
        container.innerHTML=arr.map(p=>{const r=map[p.id]; const dist=userLoc?fmtKm(kmDist(userLoc.lat,userLoc.lng,p.lat,p.lng)):null; return `<div class="bg-white border rounded-2xl p-4 space-y-2"><div class="flex items-center justify-between"><div><div class="text-lg font-semibold">${p.name}</div><div class="text-sm text-gray-500">${p.province} · ${p.category}</div></div><div class="flex items-center gap-2"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-blue-600 text-white">⭐ ${p.rating.toFixed(1)}</span><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">Crowd: ${p.crowd}</span>${dist?`<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs border">📍 ${dist}</span>`:""}</div></div>${r?`<div class="bg-gray-50 rounded-xl p-3"><div class="text-sm text-gray-700">“${clip(r.text,140)}”</div><div class="mt-1 flex items-center gap-2"><span class="text-xs text-gray-500">— ${r.user} · ${r.userLevel||""}</span>${r.verifiedVisit?`<span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] bg-gray-100">✔︎ Verified Visitor</span>`:""}</div></div>`:""}<div class="flex flex-wrap gap-2">${p.tags.map(t=>`<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs border">#${t}</span>`).join("")}</div><div class="flex items-center justify-between pt-1"><div class="text-xs text-gray-500">เวลาทำการ: ${p.openingHours}</div><div class="flex items-center gap-2"><button class="border rounded-2xl px-3 py-1.5 text-sm" data-act="detail" data-id="${p.id}">ดูรายละเอียด</button><button class="rounded-2xl px-3 py-1.5 text-sm bg-blue-600 text-white" data-act="share" data-text="TripMate · ${p.name} · ${p.province}">แชร์</button></div></div></div>`;}).join("");
      }
    }
    function renderSearchChips(){ const cats=["ทั้งหมด","คาเฟ่","ธรรมชาติ","ที่พัก","ร้านอาหาร","แลนด์มาร์ก"]; $("#categoryChips").innerHTML=cats.map(c=>`<button class="px-3 py-1.5 rounded-2xl text-sm ${CAT===c?"bg-blue-600 text-white":"border"}" data-cat="${c}">${c}</button>`).join(""); const provs=["ทั้งหมด",...Array.from(new Set(places.map(p=>p.province)))]; $("#provinceChips").innerHTML=provs.map(p=>`<button class="px-3 py-1.5 rounded-2xl text-sm ${PROV===p?"bg-blue-600 text-white":"border"}" data-prov="${p}">${p}</button>`).join(""); }
    function renderSearchResults(){ const arr=filteredPlaces(); const map=latestByPlace(); $("#searchResults").innerHTML=arr.length?arr.map(p=>{const r=map[p.id]; const dist=userLoc?fmtKm(kmDist(userLoc.lat,userLoc.lng,p.lat,p.lng)):null; return `<div class="bg-white border rounded-2xl p-4 space-y-2"><div class="flex items-center justify-between"><div><div class="text-lg font-semibold">${p.name}</div><div class="text-sm text-gray-500">${p.province} · ${p.category}</div></div><div class="flex items-center gap-2"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-blue-600 text-white">⭐ ${p.rating.toFixed(1)}</span><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">Crowd: ${p.crowd}</span>${dist?`<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs border">📍 ${dist}</span>`:""}</div></div>${r?`<div class="bg-gray-50 rounded-xl p-3"><div class="text-sm text-gray-700">“${clip(r.text,140)}”</div><div class="mt-1 flex items-center gap-2"><span class="text-xs text-gray-500">— ${r.user} · ${r.userLevel||""}</span>${r.verifiedVisit?`<span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] bg-gray-100">✔︎ Verified Visitor</span>`:""}</div></div>`:""}<div class="flex flex-wrap gap-2">${p.tags.map(t=>`<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs border">#${t}</span>`).join("")}</div><div class="flex items-center justify-between pt-1"><div class="text-xs text-gray-500">เวลาทำการ: ${p.openingHours}</div><div class="flex items-center gap-2"><button class="border rounded-2xl px-3 py-1.5 text-sm" data-act="detail" data-id="${p.id}">ดูรายละเอียด</button><button class="rounded-2xl px-3 py-1.5 text-sm bg-blue-600 text-white" data-act="share" data-text="TripMate · ${p.name} · ${p.province}">แชร์</button></div></div></div>`;}).join(""):`<p class="text-sm text-gray-500">ไม่พบผลลัพธ์ตามตัวกรอง</p>`; }
    function renderGroups(){ const container=$("#groupContainer"); const existing=container.getAttribute("data-group")==="1"; if(!existing){ container.innerHTML=`<div class="bg-white border rounded-2xl p-4"><div class="flex items-center justify-between mb-2"><div class="text-lg font-semibold">สร้างกลุ่มไปเที่ยว</div><button id="createGroupBtn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-2xl px-3 py-1.5">+ สร้างกลุ่มใหม่</button></div><p class="text-sm text-gray-600">เพิ่มเพื่อน เสนอที่เที่ยว แล้วโหวตเลือก จากนั้นกด "สรุปทริป" เพื่อสร้างแผนแบบคลิกเดียว</p></div><div id="groupArea" class="mt-3"></div>`; container.setAttribute("data-group","1"); $("#createGroupBtn").onclick=()=>{ const g={id:"g_"+Date.now(), name:"ทริปเชียงใหม่ปีใหม่ 2025", members:["แทมมี่","นนท์","พีท","ชิว"], date:"2025-12-30", province:"เชียงใหม่", proposals:["p_monjam","p_somewhere_cnx","p_doisuthep"], votes:{}, confirmedPlaceIds:null}; container.dataset.gdata=JSON.stringify(g); drawGroup(g); }; } else if(container.dataset.gdata){ drawGroup(JSON.parse(container.dataset.gdata)); } }
    function drawGroup(g){ const area=$("#groupArea"); area.innerHTML=`<div class="bg-white border rounded-2xl p-4 flex items-center justify-between"><div><div class="text-lg font-semibold">${g.name}</div><div class="text-sm text-gray-500">สมาชิก: ${g.members.join(", ")}</div></div><button class="border rounded-2xl px-3 py-1.5" onclick="navigator.clipboard.writeText('เข้าร่วมกลุ่ม: ${g.name}')">แชร์</button></div><div class="bg-white border rounded-2xl p-4 mt-3"><div class="font-semibold mb-2">รายการโหวต</div>${g.proposals.map(pid=>{const p=places.find(x=>x.id===pid); const counts=Object.values(g.votes).filter(v=>v===pid).length; const voted=g.votes[currentUser.name]===pid; return `<div class="flex items-center justify-between border rounded-xl p-3 mb-2 ${voted?'border-blue-500':''}"><div><div class="font-medium">${p.name}</div><div class="text-xs text-gray-500">${p.province} · ⭐ ${p.rating.toFixed(1)}</div></div><div class="flex items-center gap-3"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">โหวต: ${counts}</span><button class="px-3 py-1.5 rounded-2xl ${voted?'bg-blue-600 text-white':'border'}" data-vote="${pid}">${voted?'โหวตแล้ว':'โหวต'}</button></div></div>`}).join("")}<div class="flex items-center justify-between pt-2"><div class="text-sm text-gray-500">กดสรุปเพื่อสร้าง Trip Plan (One-click)</div><button id="confirmTripBtn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-2xl px-3 py-1.5">🗺️ สรุปทริป</button></div></div><div id="tripSummary"></div>`; area.querySelectorAll("[data-vote]").forEach(btn=>{btn.addEventListener("click",()=>{g.votes[currentUser.name]=btn.getAttribute("data-vote"); document.querySelector("#groupContainer").dataset.gdata=JSON.stringify(g); drawGroup(g);});}); $("#confirmTripBtn").onclick=()=>{const counts={}; g.proposals.forEach(pid=>counts[pid]=0); Object.values(g.votes).forEach(pid=>counts[pid]=(counts[pid]||0)+1); const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([pid])=>pid); g.confirmedPlaceIds=top; document.querySelector("#groupContainer").dataset.gdata=JSON.stringify(g); drawTripSummary(top); alert("สรุปทริปแล้ว: รวมข้อมูลแบบคลิกเดียว");}; }
    function drawTripSummary(ids){ const cont=$("#tripSummary"); cont.innerHTML=`<div class="bg-white border rounded-2xl p-4 mt-3"><div class="font-semibold mb-2">สรุปทริป (One-click Plan)</div>${ids.map(pid=>{const p=places.find(x=>x.id===pid); const map=latestByPlace(); const r=map[pid]; return `<div class="border rounded-2xl p-3 mb-2"><div class="flex items-center justify-between"><div><div class="font-medium">${p.name}</div><div class="text-xs text-gray-500">${p.province} · ${p.category}</div></div><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-blue-600 text-white">⭐ ${p.rating.toFixed(1)}</span></div>${r?`<div class="text-sm text-gray-600 mt-1">“${clip(r.text,120)}” — ${r.user}</div>`:""}<div class="mt-2"><button class="border rounded-2xl px-3 py-1.5 text-sm" data-act="detail" data-id="${p.id}">ดูรายละเอียด</button></div></div>`}).join("")}<div class="flex items-center justify-end"><button class="border rounded-2xl px-3 py-1.5" onclick="navigator.clipboard.writeText('Trip Plan พร้อมแชร์')">แชร์แผน</button></div></div>`; }
    function renderRewards(){ $("#pointsEl").textContent=user.points+" pts"; $("#badgesEl").textContent="แบดจ์: "+(user.badges.join(", ")||"-"); $("#rewardsList").innerHTML=rewardsCatalog.map(rw=>`<div class="bg-white border rounded-2xl p-4 flex items-center justify-between"><div><div class="font-semibold">${rw.name}</div><div class="text-sm text-gray-500">${rw.desc}</div></div><div class="flex items-center gap-3"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">${rw.cost} pts</span><button class="bg-blue-600 hover:bg-blue-700 text-white rounded-2xl px-3 py-1.5" data-redeem="${rw.id}">แลก</button></div></div>`).join(""); $("#rewardsList").querySelectorAll("[data-redeem]").forEach(btn=>{btn.addEventListener("click",()=>{const rw=rewardsCatalog.find(r=>r.id===btn.getAttribute("data-redeem")); if(user.points<rw.cost){alert("แต้มไม่พอแลก");return;} user.points-=rw.cost; renderRewards(); renderProfileHeader(); alert(`แลก "${rw.name}" สำเร็จ (mock)`);});}); }
    function renderProfileHeader(){ $("#userNameEl").textContent=user.name; $("#userHandleEl").textContent=user.handle; $("#userMetaEl").textContent=`ระดับ: ${user.level} · แต้ม: ${user.points} · แบดจ์: ${user.badges.join(", ")||"-"}`; const my=reviews.filter(r=>r.user===user.name); $("#myReviews").innerHTML=my.length?my.map(r=>{const p=places.find(x=>x.id===r.placeId); return `<div class="bg-white border rounded-2xl p-3"><div class="flex items-center justify-between"><div class="font-medium">${p.name}</div><div class="text-amber-600">⭐ ${r.rating}</div></div><p class="text-sm mt-1">${r.text}</p>${r.verifiedVisit?`<div class="mt-2"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">✔︎ Verified Visitor</span></div>`:""}</div>`;}).join(""):`<p class="text-sm text-gray-500">ยังไม่มีรีวิว</p>`; }
    function renderDetail(place){ const placeReviews=reviews.filter(r=>r.placeId===place.id).sort((a,b)=>a.date<b.date?1:-1); const autoNearby=places.filter(p=>p.id!==place.id).map(p=>({p,d:kmDist(place.lat,place.lng,p.lat,p.lng)})).filter(({d})=>d<=10).sort((a,b)=>a.d-b.d).map(({p})=>p); $("#detailContent").innerHTML=`<header class="space-y-1"><div class="text-xl font-semibold">${place.name}</div><div class="text-sm text-gray-500">${place.province} · ${place.category}</div><div class="flex items-center gap-2 mt-1"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-blue-600 text-white">⭐ ${place.rating.toFixed(1)}</span><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">Crowd: ${place.crowd}</span><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs border">เวลาทำการ: ${place.openingHours}</span></div></header><section><div class="font-semibold mb-2">รีวิวทั้งหมด</div><div class="space-y-2">${placeReviews.length?placeReviews.map(r=>`<div class="border rounded-xl p-3"><div class="flex items-center justify-between"><div class="font-medium">${r.user} <span class="text-xs text-gray-500">· ${r.userLevel||""}</span></div><div class="text-amber-600">⭐ ${r.rating}</div></div><p class="text-sm mt-1">${r.text}</p>${r.verifiedVisit?`<div class="mt-2"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">✔︎ Verified Visitor</span></div>`:""}</div>`).join(""):`<p class="text-sm text-gray-500">ยังไม่มีรีวิว</p>`}</div></section><section><div class="font-semibold mb-2">สถานที่ใกล้เคียง (≤10 กม.)</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${autoNearby.length?autoNearby.map(np=>`<div class="border rounded-xl p-3 flex items-center justify-between"><div><div class="font-medium">${np.name}</div><div class="text-xs text-gray-500">${np.category} · ⭐ ${np.rating.toFixed(1)}</div></div><button class="px-3 py-1.5 rounded-2xl border" data-act="detail" data-id="${np.id}">ดู</button></div>`).join(""):`<p class="text-sm text-gray-500">ยังไม่มีสถานที่ในรัศมีนี้</p>`}</div></section><div class="flex items-center justify-end gap-2"><button class="px-3 py-1.5 rounded-2xl border" onclick="navigator.clipboard.writeText('Trip: ${place.name}')">แชร์</button></div>`; }
    function populateCreatePlaces(){ $("#createPlace").innerHTML=places.map(p=>`<option value="${p.id}">${p.name} · ${p.province}</option>`).join(""); }
    function updateVerifyHint(){ const pid=$("#createPlace").value||places[0].id; const p=places.find(x=>x.id===pid); const verified=userLoc?kmDist(userLoc.lat,userLoc.lng,p.lat,p.lng)<=1:false; $("#verifyHint").innerHTML=verified?`<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs bg-gray-100">✔︎ Verified Visitor (GPS)</span>`:`* เปิดตำแหน่งใกล้สถานที่เพื่อรับสถานะ Verified`; }
    $$(".grid [data-tab]").forEach(btn=>{btn.onclick=()=>{ TAB=btn.dataset.tab; renderNav(); if(TAB==="discover"){renderDiscover()} if(TAB==="search"){renderSearchResults()} if(TAB==="groups"){renderGroups()} if(TAB==="rewards"){renderRewards()} if(TAB==="profile"){renderProfileHeader()} };});
    $("#discoverSearchInput").addEventListener("focus", ()=>{ TAB="search"; renderNav(); });
    $("#modePostsBtn").onclick=()=>{ MODE="posts"; $("#modePostsBtn").className="bg-blue-600 text-white rounded-2xl px-3 py-1.5 text-sm"; $("#modeTilesBtn").className="border rounded-2xl px-3 py-1.5 text-sm"; renderDiscover(); };
    $("#modeTilesBtn").onclick=()=>{ MODE="tiles"; $("#modeTilesBtn").className="bg-blue-600 text-white rounded-2xl px-3 py-1.5 text-sm"; $("#modePostsBtn").className="border rounded-2xl px-3 py-1.5 text-sm"; renderDiscover(); };
    document.body.addEventListener("click",(e)=>{const t=e.target.closest("[data-act]"); if(!t) return; const act=t.getAttribute("data-act"); if(act==="detail"){const id=t.getAttribute("data-id"); const p=places.find(x=>x.id===id); openDetail(p);} else if(act==="share"){const text=t.getAttribute("data-text")||"TripMate"; if(navigator.share){navigator.share({title:"TripMate", text});} else {navigator.clipboard.writeText(text); alert("คัดลอกแล้ว");}}});
    $("#closeDetail").onclick=closeDetail;
    $("#applySearchBtn").onclick=()=>{ QUERY=$("#searchInput").value||""; renderSearchResults(); };
    $("#searchInput").addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ QUERY=$("#searchInput").value||""; renderSearchResults(); }});
    $("#distSlider").addEventListener("input",(e)=>{ MAX_KM=Number(e.target.value); $("#distVal").textContent=MAX_KM; renderSearchResults(); });
    $("#categoryChips").addEventListener("click",(e)=>{ const b=e.target.closest("[data-cat]"); if(!b) return; CAT=b.getAttribute("data-cat"); renderSearchChips(); renderSearchResults(); });
    $("#provinceChips").addEventListener("click",(e)=>{ const b=e.target.closest("[data-prov]"); if(!b) return; PROV=b.getAttribute("data-prov"); renderSearchChips(); renderSearchResults(); });
    $("#openCreatePost").onclick=openCreate; $("#closeCreate").onclick=closeCreate; $("#cancelCreate").onclick=closeCreate; $("#createPlace").addEventListener("change", updateVerifyHint); $("#createRate").addEventListener("input",(e)=>$("#createRateLabel").textContent=e.target.value); $("#submitCreate").onclick=()=>{ const placeId=$("#createPlace").value; const rating=Number($("#createRate").value); const text=$("#createText").value||"ประสบการณ์ดีมาก แนะนำครับ/ค่ะ"; const p=places.find(x=>x.id===placeId); const verified=userLoc?kmDist(userLoc.lat,userLoc.lng,p.lat,p.lng)<=1:false; const newReview={id:"r_"+Date.now(), placeId, user:user.name, userLevel:user.level, rating, text, verifiedVisit:verified, date:new Date().toISOString().slice(0,10), likes:0}; reviews=[newReview,...reviews]; user.points+=10+(verified?5:0); if(verified && !user.badges.includes("Verified Explorer")) user.badges.push("Verified Explorer"); alert(`โพสต์รีวิวสำเร็จ! ได้แต้ม ${10+(verified?5:0)}`); renderDiscover(); renderRewards(); renderProfileHeader(); closeCreate(); };
    function init(){ renderNav(); renderBanners(); renderTopTags(); renderDiscover(); renderSearchChips(); renderSearchResults(); renderGroups(); renderRewards(); renderProfileHeader(); if(navigator.geolocation){ navigator.geolocation.getCurrentPosition((pos)=>{ userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude}; $("#locStatusEl").textContent="ใช้งานตำแหน่งใกล้คุณ"; $("#locInfo").textContent="ใช้งานตำแหน่งใกล้คุณ"; renderDiscover(); renderSearchResults(); updateVerifyHint(); }, ()=>{ $("#locStatusEl").textContent="โหมดไม่มีตำแหน่ง"; $("#locInfo").textContent="ไม่สามารถใช้ตำแหน่งได้ จะแสดงผลตามคะแนนนิยมแทน"; }, {enableHighAccuracy:true, timeout:7000}); } else { $("#locStatusEl").textContent="โหมดไม่มีตำแหน่ง"; } }
    init();
  </script>
